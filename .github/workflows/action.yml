name: CI

on:
  push:
    branches: [ master, feat/** ]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - 'SConscript'
      - 'ChangeLog.md'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - 'SConscript'
      - 'ChangeLog.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Check code format
        run: make format-check

  build:
    runs-on: ubuntu-latest
    needs: format-check
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y check clang

      - name: Build library
        run: make lib CC=${{ matrix.compiler }}

      - name: ROM/RAM report
        run: make size-report

      - name: Run unit tests
        run: make test CC=${{ matrix.compiler }}

  memory-check:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y check valgrind

      - name: Build with debug symbols
        run: make lib CFLAGS_EXTRA="-g -O0"

      - name: Run tests under valgrind
        run: |
          make test CFLAGS_EXTRA="-g -O0 -Wconversion -Wshadow -Wdouble-promotion"
          for t in build/tests/*; do
            valgrind --leak-check=full --error-exitcode=1 $t
          done

  example-build:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake

      - name: Example Compile
        run: |
          cd examples
          cmake -B build
          cmake --build build

      - name: Package Binaries
        run: |
          cd examples/build/bin
          tar -czvf binaries.tar.gz *

      - name: Upload examples bin
        uses: actions/upload-artifact@v4
        with:
          name: examples-bin
          path: examples/build/bin/binaries.tar.gz

  deploy-gh-pages:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get -qq install doxygen graphviz

      - name: Generate doxygen html
        run: |
          cd doc/doxygen
          doxygen Doxyfile

      - name: Deployment documentation
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: doc/doxygen/output
